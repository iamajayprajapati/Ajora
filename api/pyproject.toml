[project]
name = "ajora-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.13,<5",
    "defusedxml>=0.7,<1",
    "pymupdf>=1.25,<2",
    "pwdlib[argon2]>=0.2,<1",
    "email-validator>=2.2,<3",
    "celery[redis]>=5.5,<6",
    "zxing-cpp>=2.3,<4",
    "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
